<!DOCTYPE html>
<!--
#-------------- Start Code for : LOGIN PAGE (login.html) -----------------------
#
#  PURPOSE   : Single sign-in gate for the live AMS-v4-0 portal.
#              On success the JWT session is stored in localStorage ("ams_session")
#              and the browser is redirected back to the dashboard.
#
#  NOTE      : This is the ONLY entry point when no live session exists.
#              js/layout.js's amsRequireSession() redirects every page here.
#
#  LOOK      : Plain solid login pane (theme tokens). Username / password
#              only - no Sign Up, no social.
#              Theme and Style dropdowns here write shared ams-theme and
#              ams-ui-style keys. After sign-in, Theme, Style, and sidebar
#              Show/Hide are stored per username.
#
#  FILES USED BY THIS PAGE :
#    - css/themes.css   (color themes)
#    - css/main.css     (layout & components)
#    - css/ui-styles.css (surface styles)
#    - js/dummy-data.js (DB / API layer + session helpers)
#    - js/login.js      (submit + redirect logic)
#
#  LOGIN ACCOUNT (seeded by the API on first run) :
#    username : operator.sys
#    password : Sr#Ops@2026   (Supreme Root)
#------------------------------------------------------------------------------
-->
<html lang="en" class="login-page" data-theme="dark-grey" data-ui-style="apple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Asset Management System</title>
    <link rel="stylesheet" href="css/themes.css?v=v40u">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui-styles.css?v=v40u">
    <style>
        html.login-page .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
            position: relative;
            overflow: hidden;
            background-color: var(--bg-body);
            background-image: none;
            color: var(--text-primary);
        }
        html.login-page .login-theme-bar {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 2;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        html.login-page .login-theme-bar .select {
            width: auto;
            min-width: 150px;
            padding: 8px 10px;
            font-size: 13px;
        }
        html.login-page .login-card {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            padding: 44px 38px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        html.login-page .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
        }
        html.login-page .login-logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--accent);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent-contrast);
            font-size: 16px;
        }
        html.login-page .login-brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.01em;
        }
        html.login-page .login-brand-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        html.login-page .login-title {
            margin: 2px 0 0;
            font-size: 25px;
            font-weight: 700;
            text-align: left;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        html.login-page .login-sub {
            margin: 6px 0 0;
            text-align: left;
            font-size: 14px;
            color: var(--text-secondary);
        }
        html.login-page .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        html.login-page .login-form .field {
            margin-bottom: 0;
        }
        html.login-page .login-form label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        html.login-page .login-field-wrap {
            position: relative;
        }
        html.login-page .login-form input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14.5px;
            box-sizing: border-box;
            outline: none;
        }
        html.login-page .login-form input::placeholder {
            color: var(--text-muted);
        }
        html.login-page .login-form input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: var(--bg-input);
        }
        html.login-page .login-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 4px 6px;
        }
        html.login-page .login-toggle:hover { color: var(--accent); }
        html.login-page .login-form input[type="password"],
        html.login-page .login-form input.has-toggle {
            padding-right: 58px;
        }
        html.login-page .login-msg {
            min-height: 18px;
            font-size: 13px;
            margin: 0;
            color: var(--text-secondary);
        }
        html.login-page .login-msg.error { color: var(--danger); }
        html.login-page .btn-login {
            width: 100%;
            margin-top: 4px;
            padding: 13px 18px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: var(--accent-contrast);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
        }
        html.login-page .btn-login:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        html.login-page .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        html.login-page .login-hint {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-theme-bar">
            <select class="select" id="theme-select" aria-label="Theme"></select>
            <select class="select" id="style-select" aria-label="Style"></select>
        </div>
        <div class="login-card">
            <div class="login-brand">
                <div class="login-logo">AM</div>
                <div>
                    <div class="login-brand-name">Asset Management</div>
                    <div class="login-brand-sub">Management Portal v4.0 &middot; AMS-v4-0</div>
                </div>
            </div>
            <div>
                <h1 class="login-title">Welcome back</h1>
                <p class="login-sub">Sign in to your account</p>
            </div>

            <form class="login-form" id="login-form" autocomplete="off">
                <div class="field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <div class="login-field-wrap">
                        <input type="password" id="login-password" name="password" class="has-toggle" placeholder="Enter your password" required>
                        <button type="button" class="login-toggle" id="login-toggle-pass" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="login-msg" id="login-msg"></div>
                <button type="submit" class="btn-login" id="login-btn">Sign In</button>
            </form>

            <div class="login-hint">
                Ask your administrator for credentials.<br>
                This is the live AMS-v4-0 portal (SQL Server backed).
            </div>
        </div>
    </div>

    <script defer src="js/dummy-data.js"></script>
    <script defer src="js/theme.js?v=v40u"></script>
    <script defer src="js/login.js"></script>
</body>
</html>
