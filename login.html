<!DOCTYPE html>
<!--
#-------------- Start Code for : LOGIN PAGE (login.html) -----------------------
#
#  PURPOSE   : Single sign-in gate for the live AMS-v4-0 portal.
#              On success the JWT session is stored in localStorage ("ams_session")
#              and the browser is redirected back to the dashboard.
#
#  NOTE      : This is the ONLY entry point when no live session exists.
#              js/layout.js's amsRequireSession() redirects every page here.
#
#  LOOK      : Frosted glass card that follows the selected Theme (default
#              Platinum). Username / password only - no Sign Up, no social.
#              Theme dropdown here writes the shared ams-theme key. After
#              sign-in, Theme and sidebar Show/Hide are stored per username.
#
#  FILES USED BY THIS PAGE :
#    - css/themes.css   (color themes)
#    - css/main.css     (layout & components)
#    - css/ui-styles.css (surface styles)
#    - js/dummy-data.js (DB / API layer + session helpers)
#    - js/login.js      (submit + redirect logic)
#
#  LOGIN ACCOUNT (seeded by the API on first run) :
#    username : operator.sys
#    password : Sr#Ops@2026   (Supreme Root)
#------------------------------------------------------------------------------
-->
<html lang="en" class="login-page" data-theme="platinum" data-ui-style="glass">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Asset Management System</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui-styles.css">
    <style>
        html.login-page .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            background-color: var(--bg-body);
            background-image:
                radial-gradient(ellipse at 18% 8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 46%),
                radial-gradient(ellipse at 88% 92%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 50%),
                repeating-linear-gradient(60deg, transparent 0 26px, color-mix(in srgb, var(--accent) 9%, transparent) 26px 27px),
                repeating-linear-gradient(-60deg, transparent 0 26px, color-mix(in srgb, var(--accent) 6%, transparent) 26px 27px);
            color: var(--text-primary);
        }
        html.login-page .login-theme-bar {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 2;
        }
        html.login-page .login-theme-bar .select {
            width: auto;
            min-width: 150px;
            padding: 8px 10px;
            font-size: 13px;
        }
        html.login-page .login-ribbons,
        html.login-page .login-ribbons::before,
        html.login-page .login-ribbons::after {
            content: "";
            position: absolute;
            inset: -20%;
            pointer-events: none;
            background:
                linear-gradient(118deg, transparent 38%, color-mix(in srgb, var(--accent) 10%, transparent) 46%, color-mix(in srgb, var(--accent) 28%, transparent) 50%, color-mix(in srgb, var(--accent) 10%, transparent) 54%, transparent 62%);
            filter: blur(10px);
            animation: loginRibbonDrift 18s linear infinite;
        }
        html.login-page .login-ribbons::before {
            background:
                linear-gradient(72deg, transparent 42%, color-mix(in srgb, var(--accent) 8%, transparent) 49%, color-mix(in srgb, var(--accent) 22%, transparent) 52%, color-mix(in srgb, var(--accent) 8%, transparent) 55%, transparent 64%);
            animation-duration: 26s;
            animation-direction: reverse;
            filter: blur(16px);
        }
        html.login-page .login-ribbons::after {
            background:
                linear-gradient(156deg, transparent 40%, color-mix(in srgb, var(--accent) 6%, transparent) 48%, color-mix(in srgb, var(--accent) 18%, transparent) 51%, color-mix(in srgb, var(--accent) 6%, transparent) 54%, transparent 66%);
            animation-duration: 32s;
            filter: blur(22px);
            opacity: 0.85;
        }
        @keyframes loginRibbonDrift {
            from { transform: translate3d(-8%, 4%, 0) rotate(0.2deg); }
            50% { transform: translate3d(6%, -5%, 0) rotate(-0.4deg); }
            to { transform: translate3d(-8%, 4%, 0) rotate(0.2deg); }
        }
        html.login-page .login-card {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            padding: 36px 32px 28px;
            border-radius: 20px;
            background: color-mix(in srgb, var(--bg-card) 42%, transparent);
            border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--border));
            box-shadow:
                0 24px 60px color-mix(in srgb, var(--bg-body) 55%, transparent),
                0 0 0 1px color-mix(in srgb, var(--accent) 8%, transparent) inset,
                0 1px 0 color-mix(in srgb, var(--text-primary) 28%, transparent) inset;
            backdrop-filter: blur(22px) saturate(1.35);
            -webkit-backdrop-filter: blur(22px) saturate(1.35);
        }
        html.login-page .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        html.login-page .login-logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 35%, transparent), color-mix(in srgb, var(--accent) 16%, transparent));
            border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--border));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 16px;
            box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text-primary) 25%, transparent);
        }
        html.login-page .login-brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.01em;
        }
        html.login-page .login-brand-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }
        html.login-page .login-title {
            margin: 18px 0 4px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        html.login-page .login-sub {
            margin: 0 0 22px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
        html.login-page .login-form .field {
            margin-bottom: 16px;
        }
        html.login-page .login-form label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        html.login-page .login-field-wrap {
            position: relative;
        }
        html.login-page .login-form input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid color-mix(in srgb, var(--accent) 32%, var(--border));
            background: color-mix(in srgb, var(--bg-input) 42%, transparent);
            color: var(--text-primary);
            font-size: 14px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        html.login-page .login-form input::placeholder {
            color: var(--text-muted);
        }
        html.login-page .login-form input:focus {
            outline: none;
            border-color: color-mix(in srgb, var(--accent) 85%, var(--border));
            box-shadow: 0 0 0 3px var(--accent-soft);
            background: color-mix(in srgb, var(--bg-input) 55%, transparent);
        }
        html.login-page .login-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 4px 6px;
        }
        html.login-page .login-toggle:hover { color: var(--accent); }
        html.login-page .login-form input[type="password"],
        html.login-page .login-form input.has-toggle {
            padding-right: 58px;
        }
        html.login-page .login-msg {
            min-height: 18px;
            font-size: 13px;
            margin: 4px 0 12px;
            color: var(--text-secondary);
        }
        html.login-page .login-msg.error { color: var(--danger); }
        html.login-page .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid color-mix(in srgb, var(--accent) 72%, var(--border));
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 42%, transparent), color-mix(in srgb, var(--accent) 16%, transparent));
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 650;
            letter-spacing: 0.04em;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow:
                0 8px 24px color-mix(in srgb, var(--bg-body) 28%, transparent),
                inset 0 1px 0 color-mix(in srgb, var(--text-primary) 28%, transparent);
        }
        html.login-page .btn-login:hover {
            background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 55%, transparent), color-mix(in srgb, var(--accent) 22%, transparent));
            border-color: var(--accent-hover);
        }
        html.login-page .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        html.login-page .login-hint {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.6;
        }
        @media (prefers-reduced-motion: reduce) {
            html.login-page .login-ribbons,
            html.login-page .login-ribbons::before,
            html.login-page .login-ribbons::after { animation: none; }
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-ribbons" aria-hidden="true"></div>
        <div class="login-theme-bar">
            <select class="select" id="theme-select" aria-label="Theme"></select>
        </div>
        <div class="login-card">
            <div class="login-brand">
                <div class="login-logo">AM</div>
                <div>
                    <div class="login-brand-name">Asset Management</div>
                    <div class="login-brand-sub">Management Portal v4.0 &middot; AMS-v4-0</div>
                </div>
            </div>
            <h1 class="login-title">Welcome back</h1>
            <p class="login-sub">Sign in to your account</p>

            <form class="login-form" id="login-form" autocomplete="off">
                <div class="field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <div class="login-field-wrap">
                        <input type="password" id="login-password" name="password" class="has-toggle" placeholder="Enter your password" required>
                        <button type="button" class="login-toggle" id="login-toggle-pass" aria-label="Show password">Show</button>
                    </div>
                </div>
                <div class="login-msg" id="login-msg"></div>
                <button type="submit" class="btn-login" id="login-btn">Sign In</button>
            </form>

            <div class="login-hint">
                Ask your administrator for credentials.<br>
                This is the live AMS-v4-0 portal (SQL Server backed).
            </div>
        </div>
    </div>

    <script defer src="js/dummy-data.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/login.js"></script>
</body>
</html>
