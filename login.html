<!DOCTYPE html>
<!--
#-------------- Start Code for : LOGIN PAGE (login.html) -----------------------
#
#  PURPOSE   : Single sign-in gate for the live AMS-TEST portal.
#              On success the JWT session is stored in localStorage ("ams_session")
#              and the browser is redirected back to the dashboard.
#
#  NOTE      : This is the ONLY entry point when no live session exists.
#              js/layout.js's amsRequireSession() redirects every page here.
#
#  FILES USED BY THIS PAGE :
#    - css/themes.css   (color themes)
#    - css/main.css     (layout & components)
#    - css/ui-styles.css (surface styles)
#    - js/dummy-data.js (DB / API layer + session helpers)
#    - js/login.js      (submit + redirect logic)
#
#  LOGIN ACCOUNT (seeded by the API on first run) :
#    username : operator.sys
#    password : Sr#Ops@2026   (Supreme Root)
#------------------------------------------------------------------------------
-->
<html lang="en" data-theme="dark-grey">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Asset Management System</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/ui-styles.css">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-body, #17181c);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card, #212226);
            border: 1px solid var(--border, #33343a);
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .login-logo {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4f7cff, #7a4fff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 18px;
        }
        .login-brand-name {
            font-size: 18px;
            font-weight: 700;
        }
        .login-brand-sub {
            font-size: 12px;
            color: var(--text-muted, #6b7280);
        }
        .login-form .field {
            margin-bottom: 16px;
        }
        .login-form label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-muted, #6b7280);
        }
        .login-form input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border, #33343a);
            background: var(--bg-input, #17181c);
            color: var(--text-primary, #e5e7eb);
            font-size: 14px;
            box-sizing: border-box;
        }
        .login-form input:focus {
            outline: none;
            border-color: #4f7cff;
        }
        .login-msg {
            min-height: 18px;
            font-size: 13px;
            margin: 4px 0 12px;
        }
        .login-msg.error { color: #ff5c5c; }
        .btn-login {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #4f7cff, #7a4fff);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-hint {
            margin-top: 18px;
            font-size: 12px;
            color: var(--text-muted, #6b7280);
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-logo">AM</div>
                <div>
                    <div class="login-brand-name">Asset Management</div>
                    <div class="login-brand-sub">Management Portal v4.0 &middot; AMS-TEST</div>
                </div>
            </div>

            <form class="login-form" id="login-form" autocomplete="off">
                <div class="field">
                    <label for="login-username">Username</label>
                    <input type="text" id="login-username" name="username" placeholder="Enter your username" required>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="login-msg" id="login-msg"></div>
                <button type="submit" class="btn-login" id="login-btn">Sign In</button>
            </form>

            <div class="login-hint">
                Ask your administrator for credentials.<br>
                This is the live AMS-TEST portal (SQL Server backed).
            </div>
        </div>
    </div>

    <script defer src="js/dummy-data.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/login.js"></script>
</body>
</html>
