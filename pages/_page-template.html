<!DOCTYPE html>
<!--
#-------------- Start Code for : PAGE TEMPLATE (_page-template.html) -----------
#
#  PURPOSE   : This file is a TEMPLATE / cheat-sheet for building every new
#              page in the portal. Copy it, rename it (e.g. assets.html),
#              then follow the steps below.
#
#  HOW TO CREATE A NEW PAGE :
#    1. Copy this file to  pages/<your-page>.html
#    2. Change the <title> and the two "TO EDIT" markers below.
#    3. Replace the <div id="construction-content"> block with real content.
#    4. Create pages/<your-page>.js in the js folder and load it.
#    5. Register the page in js/layout.js NAV_ITEMS so it appears in the menu.
#    6. At the bottom, replace initLayout("PAGE-KEY") and the init call.
#
#  REMEMBER : the sidebar + header render automatically from layout.js,
#  so you do NOT need to write navigation HTML on this page.
#------------------------------------------------------------------------------
-->
<html lang="en" data-theme="dark-grey">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TO EDIT : change this title -->
    <title>New Page | Asset Management System</title>

    <link rel="stylesheet" href="../css/themes.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/ui-styles.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar renders into this mount (do not edit) -->
        <aside class="sidebar" id="sidebar">
            <div id="sidebar-mount"></div>
        </aside>

        <main class="app-main">
            <!-- Top header renders into this mount (do not edit) -->
            <header class="topbar" id="topbar-mount"></header>

            <div class="app-content">
                <!-- ==================== TO EDIT : PAGE CONTENT ==================== -->
                <div id="construction-content"></div>
                <!-- ==================== END OF PAGE CONTENT ======================= -->
            </div>
        </main>
    </div>

    <!-- Scripts : always load in this order -->
    <script defer src="../js/dummy-data.js"></script>
    <script defer src="../js/theme.js"></script>
    <script defer src="../js/app.js"></script>
    <script defer src="../js/layout.js"></script>
    <script defer src="../js/under-construction.js"></script>

    <!-- Boot the page -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            initLayout("PAGE-KEY");
            renderUnderConstruction("New Page");
        });
    </script>
</body>
</html>
<!--
#-------------- End of the code : PAGE TEMPLATE --------------------------------
#------------------------------------------------------------------------------
-->
